[book]
title = "Tor Browser Installer Docs"
authors = ["Ribhav Revalli"]
language = "en"
[output.html]
smart-punctuation = true
mathjax-support = true
site-url = "/docs/book/"
git-repository-url = "https://github.com/tbi-rust/tbi-rust.github.io/tree/main/docs"
edit-url-template = "https://github.com/tbi-rust/tbi-rust.github.io/edit/main/docs/{path}"
hash-files = true
additional-css = ["theme/css/custom.css"]
theme = "theme"
[output.html.playground]
editable = true
line-numbers = true

[output.html.code.hidelines]
python = "~"

[output.html.search]
limit-results = 20
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2

